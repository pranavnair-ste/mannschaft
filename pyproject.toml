[project]
name = "pi-harness"
version = "0.1.0"
description = "Pi-Agent Harness — Symphony-style multi-agent orchestrator with expertise loop."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranav Nair", email = "pranav.sunilnair@stengg.com" }]
dependencies = [
  "aiosqlite>=0.20.0",
  "clawteam==0.2.*",
  "fastapi>=0.136.3",
  "gitpython>=3.1.50",
  "httpx>=0.28.1",
  "jsonschema>=4.21",
  "openai>=1.0,<3.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0.3",
  "tiktoken>=0.13.0",
  "tomli-w>=1.0,<2.0",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.48.0",
]

[project.scripts]
pi-harness = "pi_harness.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-mock>=3.10",
  "pytest-timeout>=2.3,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: integration test that launches a real ClawTeam team (requires OPENAI_API_KEY and a coding-agent CLI).",
]
addopts = "-ra --strict-markers -m 'not smoke'"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
]
